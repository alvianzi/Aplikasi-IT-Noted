<style>
  :root {
    --bg:#E9EDEF; --bg-soft:#DDE3E6; --ink:#16232B; --ink-dim:#56676F; --paper:#FFFFFF; --line:#C7D0D4;
    --accent:#1F6F63; --accent-ink:#FFFFFF; --amber:#C98A2C; --danger:#B5482F;
    --shadow:0 1px 2px rgba(22,35,43,0.06), 0 8px 20px -12px rgba(22,35,43,0.18); --radius:10px;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14191C; --bg-soft:#1C2226; --ink:#E7ECEE; --ink-dim:#93A2A8; --paper:#20272B; --line:#333D42;
      --accent:#4FA895; --accent-ink:#0B1210; --amber:#E0A94F; --danger:#E17A5E;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5); }
  }
  :root[data-theme="dark"] { --bg:#14191C; --bg-soft:#1C2226; --ink:#E7ECEE; --ink-dim:#93A2A8; --paper:#20272B; --line:#333D42;
    --accent:#4FA895; --accent-ink:#0B1210; --amber:#E0A94F; --danger:#E17A5E;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5); }
  * { box-sizing: border-box; }
  input:not([type="checkbox"]):not([type="color"]):not([type="file"]), textarea { caret-color:#111111; }
  html, body { height:100%; }
  body { margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    background:var(--bg); isolation:isolate;
    transition: background-color .25s ease, color .25s ease; }
  /* Fixed ambient layer keeps the background continuous, even on very long note pages. */
  body::before { content:""; position:fixed; inset:-18%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse at 18% 12%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 43%),
      radial-gradient(ellipse at 82% 72%, color-mix(in srgb, var(--amber) 11%, transparent), transparent 42%),
      radial-gradient(ellipse at 55% 38%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 55%);
    background-size:140% 140%; animation:ambientDrift 18s ease-in-out infinite alternate; }
  @keyframes ambientDrift { from { transform:translate3d(-3%, -2%, 0) scale(1); }
    to { transform:translate3d(3%, 2%, 0) scale(1.06); } }
  #appRoot { opacity:0; transition: opacity .4s ease; }
  #appRoot { position:relative; z-index:1; }
  #appRoot.ready { opacity:1; }
  #bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
  @keyframes logoBreathe { 0%,100% { filter:drop-shadow(0 0 0 transparent); } 50% { filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 55%, transparent)); } }
  .brand img { animation: logoPop .5s cubic-bezier(.34,1.56,.64,1) both, logoBreathe 4s ease-in-out 1s infinite; transition: transform .2s ease; }
  h1,h2,.brand,.note-title { font-family:'Fraunces',Georgia,serif; }
  .font-default { font-family:'Inter',system-ui,sans-serif; }
  .font-serif { font-family:'Fraunces',Georgia,serif; }
  .font-mono { font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; }
  .font-handwriting { font-family:'Caveat',cursive; font-size:1.15em; line-height:1.35; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:220px; flex-shrink:0; background:var(--bg-soft); border-right:1px solid var(--line); padding:20px 14px;
    padding-top:calc(20px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:22px;

    transition: background .25s ease, border-color .25s ease; }

  .sidebar-bottom { margin-top:auto; display:flex; flex-direction:column; gap:2px; }
  .app-version { font-size:0.68rem; color:var(--ink-dim); text-align:center; margin-top:8px; opacity:0.7; }
  @keyframes navIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }

  .sidebar .nav-group:nth-of-type(1) .nav-item:nth-child(3) { animation-delay: .11s; }

    border-radius:24px; padding:10px 16px; box-shadow:var(--shadow); transition: background .25s ease, border-color .15s ease; }
  .search:focus-within { border-color:var(--accent); }

  .search svg { color:var(--ink-dim); flex-shrink:0; }

  .icon-round:hover { color:var(--accent); }
  .icon-round:active { transform: scale(0.92); }
  .install-app-btn { display:flex; align-items:center; justify-content:center; gap:7px; flex-shrink:0; min-height:40px;
    padding:0 12px; border:1px solid var(--line); border-radius:20px; background:var(--paper); color:var(--ink);
    box-shadow:var(--shadow); font:500 0.82rem 'Inter',system-ui,sans-serif; cursor:pointer; white-space:nowrap;
    transition:background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease; }
  .install-app-btn:hover { color:var(--accent); border-color:var(--accent); transform:translateY(-1px); }
  .install-app-btn[hidden] { display:none; }
  #themeIcon { transition: transform .3s ease; }
  .sync-note { max-width:720px; margin:0 auto 6px; font-size:0.76rem; color:var(--ink-dim); text-align:right; min-height:16px; }
  .composer-wrap { max-width:600px; margin:0 auto 30px; }
  .composer { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 16px; cursor:text; transition: background .25s ease, border-color .15s ease, box-shadow .15s ease; }
  .composer.expanded { cursor:default; box-shadow:0 2px 6px rgba(22,35,43,0.1), 0 14px 30px -14px rgba(22,35,43,0.25); }
  .composer input.title-input { width:100%; border:none; outline:none; background:transparent; font-family:'Fraunces',serif;
    font-size:1.1rem; color:#16232B; caret-color:#111111; margin-bottom:4px; }
  .composer textarea { width:100%; border:none; outline:none; background:transparent; resize:none; font-family:inherit;
    font-size:0.95rem; color:#16232B; caret-color:#111111; min-height:24px; line-height:1.5; }
  .checklist-editor { display:flex; flex-direction:column; gap:6px; margin-top:4px; }

  .composer-tools { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .swatches { display:flex; gap:6px; }

  .swatch:hover { transform: scale(1.15); }

  .icon-btn { border:none; background:transparent; cursor:pointer; color:var(--ink-dim); width:30px; height:30px;
    border-radius:6px; display:flex; align-items:center; justify-content:center; transition: background .15s ease, color .15s ease; }
  .icon-btn:hover { background:var(--bg-soft); color:var(--ink); }

    border-radius:6px; cursor:pointer; font-family:inherit; transition: background .15s ease; }
  .btn-text:hover { background:var(--bg-soft); }

    border-radius:6px; cursor:pointer; font-weight:600; font-family:inherit; transition: opacity .15s ease, transform .1s ease; }
  .btn-primary:hover { opacity:0.88; }

  .section-heading { font-size:0.75rem; color:var(--ink-dim); margin:4px 4px 12px; letter-spacing:0.03em; }
  .grid { columns:240px; column-gap:16px; max-width:1100px; margin:0 auto 32px; }
  @keyframes noteIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .note { break-inside:avoid; min-width:0; margin-bottom:16px; border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:var(--shadow); padding:14px 16px; position:relative; background:var(--paper);
    background-image:linear-gradient(145deg, rgba(255,255,255,0.30), transparent 58%),
      repeating-linear-gradient(0deg, transparent 0 5px, rgba(106,76,27,0.018) 5px 6px);
    border-color:color-mix(in srgb, var(--line) 68%, #B58B47);
    transition: background .25s ease, border-color .25s ease, box-shadow .18s ease, transform .18s ease;
    animation: noteIn .25s ease both; }
  .note:hover { box-shadow:0 3px 8px rgba(87,64,25,0.10), 0 16px 32px -14px rgba(22,35,43,0.26); transform:translateY(-3px); }
  .note-title { min-width:0; overflow-wrap:anywhere; font-size:1.02rem; margin:0 0 6px; font-weight:500; }

  .link-preview:hover { transform:translateY(-1px); box-shadow:0 5px 14px rgba(30,35,30,0.12); }

    overflow:hidden; background:color-mix(in srgb, var(--accent) 14%, transparent); }
  .link-preview-thumb img { width:100%; height:100%; min-height:68px; object-fit:cover; display:block; }
  .link-preview-mark { font-family:'Fraunces',Georgia,serif; font-size:1.5rem; font-weight:600; color:var(--accent); }

  .link-preview-open { align-self:center; margin:0 10px; font-size:1rem; opacity:0.6; }
  .nm-body .link-preview { margin:12px 0; }
  .image-preview-strip { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

  .note-images img:first-child:nth-last-child(1) { grid-column:1 / -1; max-height:220px; }

<script src="assets/simpan-ui.js?v=1.9.4"></script>
<script>
(function(){
  var APP_VERSION = '1.9.4'; 
  SimpanUI.setVersion('appVersion', APP_VERSION);
  SimpanUI.initRipple();
  SimpanUI.initTilt('#pinnedGrid, #othersGrid', '.note');
  var toast = SimpanUI.toast;

  var COLORS = ['#F3E1AE','#F4E7C3','#D9E8D4','#D3E4EE','#F0D9DC','#E5DCF0'];
  var state = { notes: [], view: 'active', activeTag: null, search: '', editingId: null, csrf: null, isAdmin: false, canEdit: false, allLabels: [] };
  var isComposerBusy = false;

  function api(url, opts){
    opts = opts || {};
    opts.credentials = 'same-origin';
    opts.headers = opts.headers || {};
    if (opts.body) opts.headers['Content-Type'] = 'application/json';
    if (opts.method && opts.method !== 'GET') opts.headers['X-CSRF-Token'] = state.csrf || '';
    return fetch(url, opts).then(function(r){
      return r.json().then(function(d){
        if (r.status === 401) {
          window.location.href = d.timeout ? 'login.html?timeout=1' : 'login.html';
          throw new Error('unauth');
        }
        if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan');
        return d;
      });
    });
  }

  function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function linkPreviewHTML(rawUrl){
    var parsed;
    try { parsed = new URL(rawUrl); } catch (_) { return escapeHTML(rawUrl); }
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return escapeHTML(rawUrl);
    var host = parsed.hostname.replace(/^www\./i, '');
    var youtubeId = '';
    if (host === 'youtu.be') youtubeId = parsed.pathname.slice(1).split('/')[0];
    else if (/(^|\.)youtube\.com$/i.test(host)) {
      youtubeId = parsed.searchParams.get('v') || ((parsed.pathname.match(/^\/(?:embed|shorts)\/([^/?]+)/) || [])[1] || '');
    }
    var isYouTube = /^[\w-]{11}$/.test(youtubeId);
    var title = isYouTube ? 'YouTube' : host;
    if (/^(support|learn)\.microsoft\.com$/i.test(host)) title = 'Microsoft Support';
    else if (/^(docs\.)?google\.com$/i.test(host)) title = 'Google';
    var thumb = isYouTube
      ? '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(youtubeId) + '/mqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : '<span class="link-preview-mark">' + escapeHTML((title.charAt(0) || '↗').toUpperCase()) + '</span>';
    return '<a class="link-preview" href="' + escapeHTML(parsed.href) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="link-preview-thumb">' + thumb + '</span><span class="link-preview-copy">' +
      '<span class="link-preview-title">' + escapeHTML(title) + '</span><span class="link-preview-domain">' + escapeHTML(host) + '</span></span>' +
      '<span class="link-preview-open" aria-hidden="true">↗</span></a>';
  }

  function renderBodyWithLinks(text){
    var re = /https?:\/\/[^\s<>"']+/gi, match, html = '', last = 0, previews = 0;
    while ((match = re.exec(text || '')) !== null) {
      var raw = match[0], url = raw;
      while (/[),.!?;:]$/.test(url)) url = url.slice(0, -1);
      html += escapeHTML(text.slice(last, match.index));
      if (url && previews < 4) {
        html += linkPreviewHTML(url) + escapeHTML(raw.slice(url.length));
        previews++;
      } else html += escapeHTML(raw);
      last = match.index + raw.length;
    }
    return html + escapeHTML((text || '').slice(last));
  }

  SimpanUI.initThemeToggle('themeToggle', 'themeIcon');
  if (SimpanUI.initInstallButton) SimpanUI.initInstallButton();
  SimpanUI.initParticles('bgCanvas');

  // ---------- Sesi ----------
  var authWaitMessage = setTimeout(function(){
    document.getElementById('gate').textContent = 'Server belum merespons. Periksa koneksi lalu muat ulang halaman.';
  }, 12000);
  api('auth.php').then(function(d){
    clearTimeout(authWaitMessage);
    if (!d.loggedIn) { window.location.href = d.timeout ? 'login.html?timeout=1' : 'login.html'; return; }
    state.csrf = d.csrfToken; state.isAdmin = d.isAdmin; state.canEdit = !!d.isAdmin;
    if (!state.canEdit) document.body.classList.add('readonly');
    document.getElementById('whoami').textContent = d.displayName + (d.isAdmin ? ' · admin' : ' · lihat saja');
    if (d.isAdmin) document.getElementById('adminLink').style.display = 'flex';
    document.getElementById('gate').style.display = 'none';
    document.getElementById('appRoot').style.display = 'flex';
    requestAnimationFrame(function(){ document.getElementById('appRoot').classList.add('ready'); });
    loadNotes();
    loadLabels();
    setInterval(function(){ if (!isComposerBusy && !state.editingId) loadNotes(true); }, 7000);
    SimpanUI.initInactivityLogout({
      minutes: 30,

    return api('notes.php', opts).then(function(d){
      var nextNotes = d.notes.map(function(n){
        return { id:n.id, title:n.title, body:n.body, checklist:n.checklist, color:n.color, textColor:n.textColor, fontFamily:n.fontFamily||'default',
          tags:n.tags||[], images:n.images||[],
          pinned:n.pinned, archived:n.archived, trashed:n.trashed, createdBy:n.createdBy, updatedBy:n.updatedBy, updatedAt:n.updatedAt };

      if (JSON.stringify(nextNotes) === JSON.stringify(state.notes)) return;

  function autoTextColor(hex){
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
    if (!m) return '#16232B';
    var lum = (0.299 * parseInt(m[1],16) + 0.587 * parseInt(m[2],16) + 0.114 * parseInt(m[3],16)) / 255;
    return lum > 0.55 ? '#16232B' : '#F1F5F6';
  }

  var TEXT_COLORS = [null, '#16232B', '#B5482F', '#1F6F63', '#C98A2C', '#2952A3', '#6B3FA0'];
  var FONT_CLASSES = ['font-default','font-serif','font-mono','font-handwriting'];

  function applyComposerPreview(){
    composer.style.background = composerColor;
    var textColor = composerTextColor || autoTextColor(composerColor);
    titleInput.style.color = textColor; bodyInput.style.color = textColor;

  function renderBoxSwatches(){
    boxColorSwatches.innerHTML = '';
    COLORS.forEach(function(c){
      var s = document.createElement('button');
      s.type = 'button'; s.className = 'style-swatch' + (c === composerColor ? ' selected' : '');
      s.style.background = c;
      s.addEventListener('click', function(){ composerColor = c; applyComposerPreview(); renderBoxSwatches(); });
      boxColorSwatches.appendChild(s);
    });
    var custom = document.createElement('span');
    custom.className = 'style-swatch style-swatch-custom' + (COLORS.indexOf(composerColor) === -1 ? ' selected' : '');
    custom.style.background = COLORS.indexOf(composerColor) === -1 ? composerColor : 'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)';
    var inp = document.createElement('input');
    inp.type = 'color'; inp.value = COLORS.indexOf(composerColor) === -1 ? composerColor : '#F3E1AE';
    inp.addEventListener('input', function(){ composerColor = inp.value; applyComposerPreview(); renderBoxSwatches(); });
    custom.appendChild(inp);
    boxColorSwatches.appendChild(custom);

  function renderTextSwatches(){

    noneBtn.addEventListener('click', function(){ composerTextColor = null; applyComposerPreview(); renderTextSwatches(); });
    textColorSwatches.appendChild(noneBtn);

    TEXT_COLORS.slice(1).forEach(function(c){
      var s = document.createElement('button');
      s.type = 'button'; s.className = 'style-swatch' + (c === composerTextColor ? ' selected' : '');

      s.addEventListener('click', function(){ composerTextColor = c; applyComposerPreview(); renderTextSwatches(); });
      textColorSwatches.appendChild(s);

    var isCustom = composerTextColor !== null && TEXT_COLORS.indexOf(composerTextColor) === -1;
    var custom = document.createElement('span');
    custom.className = 'style-swatch style-swatch-custom' + (isCustom ? ' selected' : '');

  function expandComposer(){

    composer.classList.toggle('editing', !!on);
    document.getElementById('saveBtn').textContent = on ? 'Perbarui' : 'Simpan';

  titleInput.addEventListener('focus', expandComposer);

  function addChecklistRow(text, done){
    var row = document.createElement('div');
    row.className = 'checklist-row';
    row.innerHTML = '<input type="checkbox"' + (done?' checked':'') + '><input type="text" placeholder="Item…">';
    var txt = row.querySelector('input[type=text]');

    txt.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); addChecklistRow('', false); checklistEditor.lastChild.querySelector('input[type=text]').focus(); }

    checklistEditor.appendChild(row);

  checklistToggleBtn.addEventListener('click', function(){

  // ---------- Gambar ----------
  function renderImagePreview(){
    imagePreviewStrip.innerHTML = composerImages.map(function(fn){
      return '<div class="thumb"><img src="uploads/' + encodeURIComponent(fn) + '"><button type="button" class="thumb-remove" data-fn="' + fn + '">✕</button></div>';
    }).join('');
  }
  imagePreviewStrip.addEventListener('click', function(e){
    var btn = e.target.closest('.thumb-remove'); if (!btn) return;
    var fn = btn.getAttribute('data-fn');
    composerImages = composerImages.filter(function(f){ return f !== fn; });
    renderImagePreview();

  function uploadOneImage(file){
    var slot = document.createElement('div');
    slot.className = 'thumb uploading';
    slot.innerHTML = '<img src="' + URL.createObjectURL(file) + '">';
    imagePreviewStrip.appendChild(slot);

    var form = new FormData();
    form.append('image', file);
    return fetch('upload.php', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'X-CSRF-Token': state.csrf || '' },
      body: form
    }).then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(res){
        slot.remove();
        if (!res.ok) { toast(res.d.error || 'Gagal mengunggah gambar', 'error'); return; }
        composerImages.push(res.d.filename);
        renderImagePreview();
      })
      .catch(function(){ slot.remove(); toast('Gagal mengunggah gambar: tidak terhubung ke server.', 'error'); });
  }

  imageAddBtn.addEventListener('click', function(){ expandComposer(); imageInput.click(); });
  imageInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(imageInput.files);
    imageInput.value = '';
    files.forEach(function(file){
      if (file.size > 8 * 1024 * 1024) { toast(file.name + ' lebih dari 8MB, dilewati.', 'error'); return; }
      uploadOneImage(file);
    });

  // ---------- Label pada catatan yang sedang dibuat/diedit ----------
  var labelBtn = document.getElementById('labelBtn');
  var labelPopover = document.getElementById('labelPopover');
  var labelPopoverList = document.getElementById('labelPopoverList');
  var labelPopoverInput = document.getElementById('labelPopoverInput');

  function renderComposerTags(){
    document.getElementById('composerTagsRow').innerHTML = composerTags.map(function(t){
      return '<span class="composer-tag-chip">' + escapeHTML(t) + '<button type="button" data-tag="' + escapeHTML(t) + '">✕</button></span>';
    }).join('');
  }
  document.getElementById('composerTagsRow').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if (!btn) return;
    var t = btn.getAttribute('data-tag');
    composerTags = composerTags.filter(function(x){ return x !== t; });
    renderComposerTags(); renderLabelPopoverList();
  });

  function renderLabelPopoverList(){
    if (!state.allLabels.length) {
      labelPopoverList.innerHTML = '<div style="font-size:0.8rem;color:var(--ink-dim);padding:6px;">Belum ada label. Buat di bawah.</div>';
      return;
    }
    labelPopoverList.innerHTML = state.allLabels.map(function(name){
      var checked = composerTags.indexOf(name) !== -1;
      return '<button type="button" class="label-popover-item" data-name="' + escapeHTML(name) + '">' +
        '<input type="checkbox" ' + (checked ? 'checked' : '') + '>' + escapeHTML(name) +
        '<span class="tag-delete" data-del="' + escapeHTML(name) + '" title="Hapus label">✕</span></button>';
    }).join('');
  }
  labelPopoverList.addEventListener('click', function(e){
    var delEl = e.target.closest('.tag-delete');
    if (delEl) { e.stopPropagation(); deleteLabel(delEl.getAttribute('data-del')); return; }
    var item = e.target.closest('.label-popover-item'); if (!item) return;
    var name = item.getAttribute('data-name');
    if (composerTags.indexOf(name) === -1) composerTags.push(name);
    else composerTags = composerTags.filter(function(x){ return x !== name; });
    renderComposerTags(); renderLabelPopoverList();
  });

  labelBtn.addEventListener('click', function(e){

    stylePopover.classList.remove('open');
    labelPopover.classList.toggle('open');
    if (labelPopover.classList.contains('open')) labelPopoverInput.focus();
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.label-popover-wrap')) labelPopover.classList.remove('open');
  });

  function addNewLabelFromComposer(){
    var val = labelPopoverInput.value.trim();
    if (!val) return;
    api('labels.php', { method:'POST', body: JSON.stringify({ name: val }) }).then(function(res){
      var name = res.name || val;
      if (state.allLabels.indexOf(name) === -1) { state.allLabels.push(name); state.allLabels.sort(); }
      if (composerTags.indexOf(name) === -1) composerTags.push(name);
      labelPopoverInput.value = '';
      renderComposerTags(); renderLabelPopoverList(); renderTagNav();
    }).catch(function(err){ toast(err.message, 'error'); });
  }
  document.getElementById('labelPopoverAdd').addEventListener('click', addNewLabelFromComposer);
  labelPopoverInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); addNewLabelFromComposer(); } });

  document.getElementById('cancelBtn').addEventListener('click', collapseComposer);

  document.getElementById('saveBtn').addEventListener('click', function(){
    var title = titleInput.value.trim();
    var body = bodyInput.value.trim();
    var checklist = null;
    if (composerChecklist !== null) {
      checklist = [];
      Array.prototype.forEach.call(checklistEditor.children, function(row){
        var t = row.querySelector('input[type=text]').value.trim();
        var d = row.querySelector('input[type=checkbox]').checked;
        if (t) checklist.push({ text:t, done:d });
      });
    }
    if (!title && !body && (!checklist || !checklist.length) && !composerImages.length) { collapseComposer(); return; }

    var editingId = state.editingId;
    var payload = { title:title, body:body, checklist:checklist, color:composerColor, textColor:composerTextColor, fontFamily:composerFontFamily, images:composerImages, tags:composerTags };
    var req = editingId
      ? api('notes.php', { method:'PUT', body: JSON.stringify(Object.assign({ id: editingId }, payload)) })
      : api('notes.php', { method:'POST', body: JSON.stringify(payload) });
    req.then(function(){
      var wasNew = !editingId;
      var r = document.getElementById('saveBtn').getBoundingClientRect();
      collapseComposer(); loadNotes(); toast(wasNew ? 'Catatan disimpan' : 'Catatan diperbarui');
      if (wasNew) SimpanUI.confettiBurst(r.left + r.width / 2, r.top);
    })
       .catch(function(e){ toast('Gagal menyimpan: ' + e.message, 'error'); });
  });

  var mainNav = document.getElementById('mainNav');
  mainNav.addEventListener('click', function(e){
    var btn = e.target.closest('.nav-item'); if (!btn) return;
    state.view = btn.getAttribute('data-view'); state.activeTag = null;
    Array.prototype.forEach.call(mainNav.children, function(el){ el.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tagNav').querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
    render();

  document.getElementById('newTagForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = document.getElementById('newTagInput');
    var val = input.value.trim(); if (!val) return;
    api('labels.php', { method:'POST', body: JSON.stringify({ name: val }) }).then(function(){
      input.value = '';
      loadLabels();
    }).catch(function(err){ toast(err.message, 'error'); });
  });

  document.getElementById('searchInput').addEventListener('input', function(e){ state.search = e.target.value.toLowerCase(); render(); });

  // ---------- Render ----------
  function allTags(){
    var set = {};
    state.allLabels.forEach(function(t){ set[t]=true; });
    state.notes.forEach(function(n){ (n.tags||[]).forEach(function(t){ set[t]=true; }); });
    return Object.keys(set).sort();
  }

  function noteMatchesFilters(n){
    if (state.view === 'active' && (n.archived || n.trashed)) return false;
    if (state.view === 'archive' && (!n.archived || n.trashed)) return false;
    if (state.view === 'trash' && !n.trashed) return false;
    if (state.activeTag && (n.tags||[]).indexOf(state.activeTag) === -1) return false;
    if (state.search) {
      var hay = ((n.title||'')+' '+(n.body||'')+' '+(n.tags||[]).join(' ')+' '+((n.checklist||[]).map(function(c){return c.text;}).join(' '))).toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  function timeAgo(iso){
    var diff = (Date.now() - new Date(iso.replace(' ','T')+'Z').getTime()) / 1000;
    if (diff < 60) return 'baru saja';
    if (diff < 3600) return Math.floor(diff/60) + ' menit lalu';
    if (diff < 86400) return Math.floor(diff/3600) + ' jam lalu';
    return Math.floor(diff/86400) + ' hari lalu';
  }

  function noteCardHTML(n){
    var imagesHTML = '';
    if (n.images && n.images.length) {
      var shown = n.images.slice(0, 4);
      imagesHTML = '<div class="note-images' + (shown.length===1?' single':'') + '">' + shown.map(function(fn){
        return '<img src="uploads/' + encodeURIComponent(fn) + '" data-full="uploads/' + encodeURIComponent(fn) + '" loading="lazy">';
      }).join('') + '</div>';
    }
    var fontClass = 'font-' + (n.fontFamily || 'default');
    var textStyle = n.textColor ? (' style="color:' + n.textColor + ';"') : '';
    var titleHTML = n.title ? '<h3 class="note-title ' + fontClass + '"' + textStyle + '>' + escapeHTML(n.title) + '</h3>' : '';
    var bodyHTML = '';
    if (n.checklist && n.checklist.length) {
      bodyHTML = '<ul class="note-checklist ' + fontClass + '"' + textStyle + '>' + n.checklist.map(function(c,i){
        return '<li class="'+(c.done?'done':'')+'"><input type="checkbox" data-idx="'+i+'" '+(c.done?'checked':'')+(state.canEdit?'':' disabled')+'><span>'+escapeHTML(c.text)+'</span></li>';
      }).join('') + '</ul>';
    } else if (n.body) { bodyHTML = '<div class="note-body ' + fontClass + '"' + textStyle + '>' + renderBodyWithLinks(n.body) + '</div>'; }
    var tagsHTML = (n.tags && n.tags.length) ? '<div class="note-tags">' + n.tags.map(function(t){ return '<span class="note-tag">'+escapeHTML(t)+'</span>'; }).join('') + '</div>' : '';
    var metaHTML = '<div class="note-meta">oleh ' + escapeHTML(n.createdBy||'-') + ' · ' + timeAgo(n.updatedAt) + '</div>';

    var actions = state.view === 'trash'
      ? '<button class="icon-btn" data-action="restore" title="Pulihkan">'+iconRestore()+'</button><button class="icon-btn" data-action="delete-forever" title="Hapus permanen">'+iconTrash()+'</button>'
      : '<button class="icon-btn" data-action="edit" title="Edit">'+iconEdit()+'</button><button class="icon-btn" data-action="'+(n.archived?'unarchive':'archive')+'" title="'+(n.archived?'Batalkan arsip':'Arsipkan')+'">'+iconArchive()+'</button><button class="icon-btn" data-action="trash" title="Hapus">'+iconTrash()+'</button>';
    if (!state.canEdit) actions = '';
    var pinBtn = state.canEdit && state.view === 'active' ? '<button class="pin-btn" data-action="pin" title="'+(n.pinned?'Lepas pin':'Semat')+'">'+iconPin()+'</button>' : '';

    return '<div class="note'+(n.pinned?' pinned':'')+(state.editingId===n.id?' editing':'')+'" data-id="'+n.id+'" style="background-color:'+n.color+';color:'+autoTextColor(n.color)+';">' +
      pinBtn + imagesHTML + titleHTML + bodyHTML + tagsHTML + metaHTML + '<div class="note-actions">'+actions+'</div></div>';
  }
  function iconPin(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.5 5.5L19 9l-5 3 1 6-3-3-3 3 1-6-5-3 5.5-1.5z"/></svg>'; }
  function iconArchive(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 002 2h10a2 2 0 002-2V9M10 13h4"/></svg>'; }
  function iconTrash(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>'; }
  function iconEdit(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>'; }
  function iconRestore(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9M3 4v5h5"/></svg>'; }

  function render(){
    var visible = state.notes.filter(noteMatchesFilters);
    var pinned = visible.filter(function(n){ return n.pinned && state.view === 'active'; });
    var others = visible.filter(function(n){ return !(n.pinned && state.view === 'active'); });

    document.getElementById('pinnedSection').style.display = pinned.length ? 'block' : 'none';
    document.getElementById('pinnedGrid').innerHTML = pinned.map(noteCardHTML).join('');
    document.getElementById('othersGrid').innerHTML = others.map(noteCardHTML).join('');
    document.getElementById('othersHeading').style.display = (pinned.length && others.length) ? 'block' : 'none';
    document.getElementById('composerView').style.display = ((state.view === 'active' && !state.activeTag) || state.editingId) ? 'block' : 'none';

    var empty = visible.length === 0;
    document.getElementById('emptyState').style.display = empty ? 'block' : 'none';
    var titleEl = document.getElementById('emptyTitle'), bodyEl = document.getElementById('emptyBody');
    if (empty) {
      if (state.search) { titleEl.textContent='Tidak ditemukan'; bodyEl.textContent='Coba kata kunci lain.'; }
      else if (state.view==='archive') { titleEl.textContent='Arsip kosong'; bodyEl.textContent='Catatan yang diarsipkan akan muncul di sini.'; }
      else if (state.view==='trash') { titleEl.textContent='Sampah kosong'; bodyEl.textContent='Catatan yang dihapus akan muncul di sini.'; }
      else { titleEl.textContent='Belum ada catatan'; bodyEl.textContent='Mulai tulis sesuatu di kotak di atas — semua anggota tim akan melihatnya.'; }
    }
    SimpanUI.animateCount(document.getElementById('countActive'), state.notes.filter(function(n){ return !n.archived && !n.trashed; }).length);
    SimpanUI.animateCount(document.getElementById('countArchive'), state.notes.filter(function(n){ return n.archived && !n.trashed; }).length);
    SimpanUI.animateCount(document.getElementById('countTrash'), state.notes.filter(function(n){ return n.trashed; }).length);
    renderTagNav();
  }

  function renderTagNav(){
    var tagNav = document.getElementById('tagNav');
    tagNav.innerHTML = allTags().map(function(t){
      return '<button class="nav-item'+(state.activeTag===t?' active':'')+'" data-tag="'+escapeHTML(t)+'">' +
        '<span class="tag-chip-row"><span class="tag-dot"></span>'+escapeHTML(t)+'</span>' +
        '<span class="tag-delete" data-del="'+escapeHTML(t)+'" title="Hapus label">✕</span></button>';
    }).join('');
    tagNav.querySelectorAll('.tag-delete').forEach(function(x){
      x.addEventListener('click', function(e){ e.stopPropagation(); deleteLabel(x.getAttribute('data-del')); });
    });
    tagNav.querySelectorAll('.nav-item').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.activeTag = btn.getAttribute('data-tag'); state.view = 'active';
        Array.prototype.forEach.call(mainNav.children, function(el){ el.classList.remove('active'); });
        tagNav.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
        btn.classList.add('active'); render();
      });
    });
  }

  function deleteLabel(name){
    if (!confirm('Hapus label "' + name + '"? Label ini akan dilepas dari semua catatan yang memakainya.')) return;
    api('labels.php?name=' + encodeURIComponent(name), { method:'DELETE' }).then(function(){
      state.allLabels = state.allLabels.filter(function(x){ return x !== name; });
      composerTags = composerTags.filter(function(x){ return x !== name; });
      if (state.activeTag === name) { state.activeTag = null; state.view = 'active'; }
      renderComposerTags(); renderLabelPopoverList();
      loadNotes(); renderTagNav();
      toast('Label "' + name + '" dihapus');
    }).catch(function(err){ toast(err.message, 'error'); });
  }

  document.getElementById('pinnedGrid').addEventListener('click', handleNoteClick);
  document.getElementById('othersGrid').addEventListener('click', handleNoteClick);

  function handleNoteClick(e){
    if (e.target.closest('.link-preview')) return;
    var card = e.target.closest('.note'); if (!card) return;
    var id = parseInt(card.getAttribute('data-id'), 10);
    var n = state.notes.find(function(x){ return x.id === id; }); if (!n) return;

    if (!state.canEdit) { openPreview(id, card); return; }

    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      var action = actionBtn.getAttribute('data-action');
      if (action === 'delete-forever') {
        if (!confirm('Hapus permanen catatan ini? Tidak bisa dikembalikan.')) return;
        api('notes.php?id=' + id, { method:'DELETE' }).then(function(){ loadNotes(); toast('Catatan dihapus permanen'); });
        return;
      }
      if (action === 'edit') { openEditor(n); return; }
      var patch = {};
      if (action === 'pin') patch.pinned = !n.pinned;
      else if (action === 'archive') patch.archived = true;
      else if (action === 'unarchive') patch.archived = false;
      else if (action === 'trash') { patch.trashed = true; patch.pinned = false; }
      else if (action === 'restore') patch.trashed = false;
      api('notes.php', { method:'PUT', body: JSON.stringify(Object.assign({ id:id }, patch)) }).then(function(){ loadNotes(); });
      return;
    }

    var checkboxEl = e.target.closest('input[type=checkbox]');
    if (checkboxEl && checkboxEl.hasAttribute('data-idx')) {
      var idx = parseInt(checkboxEl.getAttribute('data-idx'), 10);
      var checklist = (n.checklist||[]).slice();
      if (checklist[idx]) checklist[idx] = Object.assign({}, checklist[idx], { done: checkboxEl.checked });
      api('notes.php', { method:'PUT', body: JSON.stringify({ id:id, checklist:checklist }) }).then(function(){ loadNotes(); });
      return;
    }

    openPreview(id, card);
  }

  function openEditor(n){
    document.getElementById('composerView').style.display = 'block';
    state.editingId = n.id; expandComposer(); setEditingUI(true);
    titleInput.value = n.title || '';
    composerColor = n.color || COLORS[0];
    composerTextColor = n.textColor || null;
    composerFontFamily = n.fontFamily || 'default';
    fontSelect.value = composerFontFamily;
    applyComposerPreview(); renderBoxSwatches(); renderTextSwatches();
    if (n.checklist && n.checklist.length) {
      composerChecklist = n.checklist.slice(); bodyInput.value = n.body || '';
      bodyInput.style.display = 'none'; checklistEditor.style.display = 'flex'; checklistEditor.innerHTML = '';
      n.checklist.forEach(function(c){ addChecklistRow(c.text, c.done); });
    } else {
      composerChecklist = null; bodyInput.value = n.body || '';
      checklistEditor.style.display = 'none'; bodyInput.style.display = 'block';
    }
    composerImages = (n.images || []).slice();
    renderImagePreview();
    composerTags = (n.tags || []).slice();
    renderComposerTags(); renderLabelPopoverList();
    document.getElementById('composerView').scrollIntoView({ behavior:'smooth', block:'start' });
    bodyInput.focus();
  }

 
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var noteModal = document.getElementById('noteModal');
  var nmCard = document.getElementById('nmCard');
  var nmContent = document.getElementById('nmContent');
  var nmMeta = document.getElementById('nmMeta');
  var nmEdit = document.getElementById('nmEdit');
  var previewId = null;

  function renderPreview(n, animate){
    var fontClass = 'font-' + (n.fontFamily || 'default');
    nmCard.style.background = n.color;
    nmCard.style.color = n.textColor || autoTextColor(n.color);
    var custom = n.textColor ? ' style="color:' + n.textColor + ';"' : '';
    var html = '';
    if (n.images && n.images.length) {
      html += '<div class="nm-images' + (n.images.length === 1 ? ' single' : '') + '">' + n.images.map(function(fn){
        var src = 'uploads/' + encodeURIComponent(fn);
        return '<img src="' + src + '" data-full="' + src + '" alt="">';
      }).join('') + '</div>';
    }
    if (n.title) html += '<h2 class="nm-title ' + fontClass + '"' + custom + '>' + escapeHTML(n.title) + '</h2>';
    if (n.body) html += '<div class="nm-body ' + fontClass + '"' + custom + '>' + renderBodyWithLinks(n.body) + '</div>';
    if (n.checklist && n.checklist.length) {
      html += '<ul class="nm-checklist ' + fontClass + '"' + custom + '>' + n.checklist.map(function(ci, i){
        return '<li class="' + (ci.done ? 'done' : '') + '"><input type="checkbox" data-idx="' + i + '" ' + (ci.done ? 'checked' : '') +
          (state.canEdit && !n.trashed ? '' : ' disabled') + '><span>' + escapeHTML(ci.text) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (n.tags && n.tags.length) html += '<div class="note-tags" style="margin:6px 0 10px;">' + n.tags.map(function(t){ return '<span class="note-tag">' + escapeHTML(t) + '</span>'; }).join('') + '</div>';
    if (!n.title && !n.body && !(n.checklist && n.checklist.length) && !(n.images && n.images.length)) html += '<p class="nm-empty">(catatan kosong)</p>';
    nmContent.classList.toggle('nm-animate', !!animate);
    nmContent.innerHTML = html;
    Array.prototype.forEach.call(nmContent.children, function(el, i){ el.style.setProperty('--i', i); });
    nmMeta.textContent = 'Dibuat oleh ' + (n.createdBy || '-') + (n.updatedBy && n.updatedBy !== n.createdBy ? ' · diubah oleh ' + n.updatedBy : '') + ' · ' + timeAgo(n.updatedAt);
    nmEdit.style.display = (state.canEdit && !n.trashed) ? '' : 'none';
  }
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var cardAnim = null, backdropAnim = null, previewClosing = false;

  function sourceRect(id){
    var el = document.querySelector('#pinnedGrid .note[data-id="' + id + '"], #othersGrid .note[data-id="' + id + '"]');
    return el ? el.getBoundingClientRect() : null;
  }
  function cancelPreviewAnim(){
    if (cardAnim) { cardAnim.onfinish = null; cardAnim.cancel(); cardAnim = null; }
    if (backdropAnim) { backdropAnim.cancel(); backdropAnim = null; }
  }

  function shrinkTransform(fromRect, toRect){
    var dx = (fromRect.left + fromRect.width / 2) - (toRect.left + toRect.width / 2);
    var dy = (fromRect.top + fromRect.height / 2) - (toRect.top + toRect.height / 2);
    var sc = Math.max(0.3, Math.min(1, fromRect.width / toRect.width));
    return 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')';
  }

  function openPreview(id, originEl){
    var n = state.notes.find(function(x){ return x.id === id; }); if (!n) return;
    cancelPreviewAnim(); previewClosing = false;
    previewId = id; renderPreview(n, true);
    var from = originEl ? originEl.getBoundingClientRect() : null;
    noteModal.classList.add('open'); document.body.style.overflow = 'hidden';
    nmContent.scrollTop = 0; nmCard.focus({ preventScroll:true });
    if (reduceMotion || !nmCard.animate) return;
    var to = nmCard.getBoundingClientRect();
    var frames = (from && from.width && to.width)
      ? [ { transform: shrinkTransform(from, to), opacity:.35 }, { transform:'none', opacity:1 } ]
      : [ { transform:'translateY(14px) scale(.96)', opacity:0 }, { transform:'none', opacity:1 } ];
    cardAnim = nmCard.animate(frames, { duration:340, easing:'cubic-bezier(.2,.8,.2,1)' });
  }


  function closePreview(fast){
    if (!noteModal.classList.contains('open') || previewClosing) return;
    var id = previewId;
    previewClosing = true; document.body.style.overflow = '';
    function finish(){
      cancelPreviewAnim();
      noteModal.classList.remove('open'); previewClosing = false; previewId = null;
    }
    if (reduceMotion || !nmCard.animate) { finish(); return; }
    var ms = fast ? 140 : 230;
    var target = fast ? null : sourceRect(id);
    var here = nmCard.getBoundingClientRect();
    var visible = target && target.width && target.bottom > 0 && target.top < window.innerHeight;
    var out = visible ? { transform: shrinkTransform(target, here), opacity:0 } : { transform:'translateY(10px) scale(.97)', opacity:0 };
    cancelPreviewAnim();
    cardAnim = nmCard.animate([ { transform:'none', opacity:1 }, out ], { duration:ms, easing:'cubic-bezier(.4,0,.6,1)', fill:'forwards' });
    backdropAnim = noteModal.animate([ { opacity:1 }, { opacity:0 } ], { duration:ms, easing:'ease', fill:'forwards' });
    cardAnim.onfinish = finish;
  }
  noteModal.addEventListener('click', function(e){ if (e.target === noteModal) closePreview(); });
  document.getElementById('nmClose').addEventListener('click', function(){ closePreview(); });
  document.getElementById('nmDone').addEventListener('click', function(){ closePreview(); });
  nmEdit.addEventListener('click', function(){
    var n = state.notes.find(function(x){ return x.id === previewId; });
    closePreview(true); if (n) openEditor(n);
  });
  nmContent.addEventListener('click', function(e){
    var img = e.target.closest('.nm-images img'); if (img) openLightbox(img.getAttribute('data-full'));
  });
  nmContent.addEventListener('change', function(e){
    var cb = e.target.closest('input[type=checkbox][data-idx]');
    var n = state.notes.find(function(x){ return x.id === previewId; });
    if (!cb || !n || !state.canEdit) return;
    var idx = parseInt(cb.getAttribute('data-idx'), 10);
    var checklist = (n.checklist || []).slice();
    if (!checklist[idx]) return;
    checklist[idx] = Object.assign({}, checklist[idx], { done: cb.checked });
    n.checklist = checklist; cb.closest('li').classList.toggle('done', cb.checked);
    api('notes.php', { method:'PUT', body: JSON.stringify({ id:n.id, checklist:checklist }) })
      .then(function(){ loadNotes(); }).catch(function(err){ toast(err.message, 'error'); });
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (lightbox.classList.contains('open')) { lightbox.classList.remove('open'); lightboxImg.src = ''; }
    else if (noteModal.classList.contains('open')) closePreview();
  });

  function openLightbox(src){ lightboxImg.src = src; lightbox.classList.add('open'); }
  lightbox.addEventListener('click', function(){ lightbox.classList.remove('open'); lightboxImg.src = ''; });
})();
</script>
