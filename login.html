<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Masuk — IT Noted</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/pwa-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/simpan-ui.css">
<style>
  :root { --bg:#E9EDEF; --ink:#16232B; --ink-dim:#56676F; --paper:#FFFFFF; --line:#C7D0D4; --accent:#1F6F63; --danger:#B5482F;
    --shadow:0 1px 2px rgba(22,35,43,0.06), 0 8px 20px -12px rgba(22,35,43,0.18); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14191C; --ink:#E7ECEE; --ink-dim:#93A2A8; --paper:#20272B; --line:#333D42; --accent:#4FA895; --danger:#E17A5E; }
  }
  :root[data-theme="dark"] { --bg:#14191C; --ink:#E7ECEE; --ink-dim:#93A2A8; --paper:#20272B; --line:#333D42; --accent:#4FA895; --danger:#E17A5E; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(800px 500px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), radial-gradient(700px 500px at 100% 100%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%), var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transition: background .25s ease, color .25s ease; overflow:hidden; position:relative; }
  #bgCanvas { position:fixed; inset:0; z-index:0; }
  @keyframes cardIn { from { opacity:0; transform:translateY(14px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes logoPop { 0% { transform:scale(0.5) rotate(-10deg); opacity:0; } 60% { transform:scale(1.1) rotate(3deg); opacity:1; } 100% { transform:scale(1) rotate(0); } }
  @keyframes shake { 10%,90% { transform:translateX(-1px); } 20%,80% { transform:translateX(2px); } 30%,50%,70% { transform:translateX(-4px); } 40%,60% { transform:translateX(4px); } }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:34px 28px; width:100%; max-width:340px; text-align:center; position:relative; z-index:1;
    transition: background .25s ease, border-color .25s ease; animation: cardIn .5s cubic-bezier(.2,.8,.2,1) both; }
  .card.shake { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) both, shake .4s ease; }
  .card img { width:92px; height:92px; margin:0 auto 14px; display:block; animation: logoPop .6s cubic-bezier(.34,1.56,.64,1) .1s both, logoFloat 5s ease-in-out .8s infinite; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.18)); }
  @keyframes logoFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  .theme-btn { position:absolute; top:14px; right:14px; border:1px solid var(--line); background:var(--bg);
    border-radius:16px; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-dim); transition: color .15s ease, transform .15s ease; }
  .theme-btn:hover { color:var(--accent); transform:scale(1.08); }
  h1 { font-family:'Fraunces',serif; font-weight:500; font-size:1.2rem; margin:0 0 2px; }
  .sub { color:var(--ink-dim); font-size:0.85rem; margin:0 0 22px; }
  label { display:block; text-align:left; font-size:0.8rem; color:var(--ink-dim); margin-bottom:4px; }
  input { width:100%; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:11px 13px;
    font-size:0.95rem; color:var(--ink); outline:none; margin-bottom:14px; font-family:inherit; transition: border-color .15s ease; }
  input:focus { border-color:var(--accent); }
  button { width:100%; padding:11px; font-size:0.92rem; border-radius:8px; border:none; background:var(--accent);
    color:#fff; font-weight:600; cursor:pointer; font-family:inherit; transition: opacity .15s ease, transform .1s ease; }
  button:hover:not(:disabled) { opacity:0.9; }
  button:active:not(:disabled) { transform:scale(0.98); }
  button:disabled { opacity:0.6; cursor:default; }
  .install-app-btn { margin-top:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .install-app-btn[hidden] { display:none; }
  .install-app-btn:hover { color:var(--accent); border-color:var(--accent); }
  .error { color:var(--danger); font-size:0.83rem; min-height:18px; margin:2px 0 12px; }
  .version-tag { position:fixed; bottom:14px; left:0; right:0; text-align:center; font-size:0.7rem; color:var(--ink-dim); opacity:0.6; z-index:1; }
</style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="card" id="loginCard">
    <button class="theme-btn" id="themeToggle" title="Ganti tema">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <img src="assets/logo.png" alt="Logo IT Noted">
    <h1>Masuk ke IT Noted</h1>
    <p class="sub" id="subText">Catatan internal — khusus akun terdaftar.</p>
    <form id="loginForm">
      <label for="u">Username</label>
      <input type="text" id="u" autocomplete="username" required>
      <label for="p">Kata Sandi</label>
      <input type="password" id="p" autocomplete="current-password" required>
      <div class="error" id="err"></div>
      <button type="submit" id="btn">Masuk</button>
    </form>
    <button type="button" class="install-app-btn" data-install-app>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 17v3h14v-3"/></svg>
      Pasang aplikasi
    </button>
  </div>
  <div class="version-tag" id="versionTag"></div>
<script src="assets/simpan-ui.js?v=1.9.4"></script>
<script>
(function(){
  var APP_VERSION = '1.9.4';
  SimpanUI.setVersion('versionTag', APP_VERSION);
  SimpanUI.initThemeToggle('themeToggle', 'themeIcon');
  if (SimpanUI.initInstallButton) SimpanUI.initInstallButton();
  SimpanUI.initParticles('bgCanvas');

  if (new URLSearchParams(window.location.search).get('timeout') === '1') {
    var sub = document.getElementById('subText');
    sub.textContent = 'Sesi berakhir karena 30 menit tidak aktif silahkan masuk kembali untuk melanjutkan.';
    sub.style.color = 'var(--danger)';
  }
})();

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('btn'), err = document.getElementById('err'), card = document.getElementById('loginCard');
  btn.disabled = true; btn.textContent = 'Memeriksa…'; err.textContent = '';
  fetch('auth.php', {
    method: 'POST', headers: {'Content-Type':'application/json'}, credentials: 'same-origin',
    body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if (!res.ok) {
        err.textContent = res.d.error || 'Gagal masuk.'; btn.disabled=false; btn.textContent='Masuk';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        return;
      }
      window.location.href = 'app.html';
    })
    .catch(function(){
      err.textContent = 'Tidak bisa terhubung ke server.'; btn.disabled=false; btn.textContent='Masuk';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    });
});
</script>
</body>
</html>
