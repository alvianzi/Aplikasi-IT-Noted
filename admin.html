<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kelola Pengguna — IT Noted</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/pwa-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/simpan-ui.css">
<style>
  :root { --bg:#E9EDEF; --bg-soft:#DDE3E6; --ink:#16232B; --ink-dim:#56676F; --paper:#FFFFFF; --line:#C7D0D4;
    --accent:#1F6F63; --danger:#B5482F; --shadow:0 1px 2px rgba(22,35,43,0.06), 0 8px 20px -12px rgba(22,35,43,0.18); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14191C; --bg-soft:#1C2226; --ink:#E7ECEE; --ink-dim:#93A2A8; --paper:#20272B; --line:#333D42; --accent:#4FA895; --danger:#E17A5E; }
  }
  :root[data-theme="dark"] { --bg:#14191C; --bg-soft:#1C2226; --ink:#E7ECEE; --ink-dim:#93A2A8; --paper:#20272B; --line:#333D42; --accent:#4FA895; --danger:#E17A5E; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    padding:28px 20px; padding-top:calc(28px + env(safe-area-inset-top,0px)); transition: background .25s ease, color .25s ease; }
  .wrap { max-width:640px; margin:0 auto; }
  .top-row { display:flex; align-items:center; justify-content:space-between; }
  .theme-btn { border:1px solid var(--line); background:var(--paper); border-radius:16px; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-dim); }
  .theme-btn:hover { color:var(--accent); }
  h1 { font-family:'Fraunces',serif; font-weight:500; font-size:1.4rem; margin:0 0 4px; }
  .btn-back { display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--accent);
    border:1px solid var(--accent); background:transparent; border-radius:8px; padding:7px 14px;
    font-size:0.85rem; font-weight:600; font-family:inherit; cursor:pointer;
    transition: background .15s ease, color .15s ease, transform .1s ease; }
  .btn-back:hover { background:var(--accent); color:#fff; }
  .btn-back:active { transform:scale(0.97); }
  .form-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; margin:20px 0; background:var(--paper); border-radius:10px;
    overflow:hidden; box-shadow:var(--shadow); }
  th, td { text-align:left; padding:10px 12px; font-size:0.88rem; border-bottom:1px solid var(--line); }
  th { color:var(--ink-dim); font-weight:600; font-size:0.75rem; }
  .badge { font-size:0.72rem; padding:2px 8px; border-radius:10px; background:var(--bg-soft); color:var(--ink-dim); }
  .badge.on { background:var(--accent); color:#fff; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  button, .btn { border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px;
    padding:5px 10px; font-size:0.78rem; cursor:pointer; font-family:inherit; }
  button.primary { background:var(--accent); color:#fff; border:none; }
  button.danger { color:var(--danger); border-color:var(--danger); background:transparent; }
  button.danger:hover { background:var(--danger); color:#fff; }
  .you-tag { font-size:0.72rem; color:var(--ink-dim); }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:18px; margin-top:24px; }
  .card h2 { font-size:1rem; margin:0 0 12px; font-weight:600; }
  .field { margin-bottom:12px; }
  label { display:block; font-size:0.8rem; color:var(--ink-dim); margin-bottom:4px; }
  input { width:100%; border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:8px 10px;
    font-size:0.9rem; color:var(--ink); font-family:inherit; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-row input { width:auto; }
  .msg { font-size:0.82rem; margin:10px 0; min-height:18px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--accent); }
  @keyframes rowIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  tbody tr { animation: rowIn .25s ease both; }
  .version-tag { text-align:center; font-size:0.7rem; color:var(--ink-dim); opacity:0.6; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <a class="btn-back" href="app.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Kembali ke catatan</a>
    <button class="theme-btn" id="themeToggle" title="Ganti tema">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <h1>Kelola Pengguna</h1>
  <p style="color:var(--ink-dim);font-size:0.88rem;">Hanya admin yang bisa membuka halaman ini. <b>Admin</b> bisa menambah &amp; mengubah catatan; <b>Anggota</b> hanya bisa melihat.</p>
  <table id="userTable"><thead><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody></tbody></table>

  <div class="card">
    <h2>Tambah Pengguna Baru</h2>
    <form id="addForm">
      <div class="field"><label>Username</label><input id="newUsername" required pattern="[a-zA-Z0-9_.]{3,50}"></div>
      <div class="field"><label>Nama Tampilan</label><input id="newDisplayName" required></div>
      <div class="field"><label>Kata Sandi (min. 8 karakter)</label><input type="password" id="newPassword" required minlength="8"></div>
      <div class="checkbox-row"><input type="checkbox" id="newIsAdmin"><label for="newIsAdmin" style="margin:0;">Jadikan admin</label></div>
      <div class="form-actions">
        <button type="submit" class="primary">Tambah Pengguna</button>
        <a class="btn-back" href="app.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Kembali ke catatan</a>
      </div>
      <div class="msg" id="addMsg"></div>
    </form>
  </div>
  <div class="version-tag" id="versionTag"></div>
</div>
<script src="assets/simpan-ui.js?v=1.9.4"></script>
<script>
(function(){
  var APP_VERSION = '1.6.0';
  SimpanUI.setVersion('versionTag', APP_VERSION);
  SimpanUI.initThemeToggle('themeToggle', 'themeIcon');
  SimpanUI.initRipple();
})();
window.toast = SimpanUI.toast;

var csrf = null;
var myId = null;

function api(url, opts){
  opts = opts || {}; opts.credentials = 'same-origin'; opts.headers = opts.headers || {};
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  if (opts.method && opts.method !== 'GET') opts.headers['X-CSRF-Token'] = csrf || '';
  return fetch(url, opts).then(function(r){
    return r.json().then(function(d){
      if (r.status === 401) {
        window.location.href = d.timeout ? 'login.html?timeout=1' : 'login.html';
        throw new Error('unauth');
      }
      if (r.status === 403 && url.indexOf('users.php') !== -1) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;">Halaman ini khusus admin.</p>'; throw new Error('forbidden'); }
      if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan');
      return d;
    });
  });
}

function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function loadUsers(){
  api('users.php').then(function(d){
    var tbody = document.querySelector('#userTable tbody');
    tbody.innerHTML = d.users.map(function(u){
      return '<tr data-id="'+u.id+'">' +
        '<td>'+escapeHTML(u.username)+'</td>' +
        '<td>'+escapeHTML(u.display_name)+'</td>' +
        '<td><span class="badge'+(u.is_admin?' on':'')+'">'+(u.is_admin?'Admin':'Anggota')+'</span></td>' +
        '<td><span class="badge'+(u.is_active?' on':'')+'">'+(u.is_active?'Aktif':'Nonaktif')+'</span></td>' +
        '<td><div class="row-actions">' +
          (u.id === myId
            ? '<span class="you-tag">Ini akun Anda</span><button data-act="reset-pass">Ganti kata sandi</button>'
            : '<button data-act="toggle-active">'+(u.is_active?'Nonaktifkan':'Aktifkan')+'</button>' +
              '<button data-act="toggle-admin">'+(u.is_admin?'Jadikan anggota':'Jadikan admin')+'</button>' +
              '<button data-act="reset-pass">Reset kata sandi</button>' +
              '<button class="danger" data-act="delete" data-name="'+escapeHTML(u.display_name)+'">Hapus</button>') +
        '</div></td></tr>';
    }).join('');
  });
}

api('auth.php').then(function(d){
  if (!d.loggedIn) { window.location.href = d.timeout ? 'login.html?timeout=1' : 'login.html'; return; }
  if (!d.isAdmin) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;">Halaman ini khusus admin.</p>'; return; }
  csrf = d.csrfToken; myId = d.userId;
  loadUsers();
  SimpanUI.initInactivityLogout({
    minutes: 30,
    onWarning: function(minsLeft){ toast('Sesi akan berakhir dalam ' + minsLeft + ' menit karena tidak aktif', 'error'); }
  });
});

document.querySelector('#userTable tbody').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if (!btn) return;
  var tr = btn.closest('tr'); var id = parseInt(tr.getAttribute('data-id'), 10);
  var act = btn.getAttribute('data-act');
  var isActiveNow = tr.querySelectorAll('.badge')[1].classList.contains('on');
  var isAdminNow = tr.querySelectorAll('.badge')[0].classList.contains('on');

  if (act === 'toggle-active') {
    api('users.php', { method:'PUT', body: JSON.stringify({ id:id, isActive: !isActiveNow }) }).then(function(){ loadUsers(); toast('Status pengguna diperbarui'); }).catch(function(e){ toast(e.message, 'error'); });
  } else if (act === 'toggle-admin') {
    api('users.php', { method:'PUT', body: JSON.stringify({ id:id, isAdmin: !isAdminNow }) }).then(function(){ loadUsers(); toast('Peran pengguna diperbarui'); }).catch(function(e){ toast(e.message, 'error'); });
  } else if (act === 'delete') {
    var nm = btn.getAttribute('data-name') || 'pengguna ini';
    if (!confirm('Hapus akun "' + nm + '" secara permanen?\n\nCatatan yang pernah dibuatnya TIDAK ikut terhapus — kepemilikannya dipindahkan ke akun Anda.')) return;
    api('users.php?id=' + id, { method:'DELETE' }).then(function(){ loadUsers(); toast('Akun "' + nm + '" dihapus'); }).catch(function(e){ toast(e.message, 'error'); });
  } else if (act === 'reset-pass') {
    var pw = prompt('Kata sandi baru untuk pengguna ini (min. 8 karakter):');
    if (!pw) return;
    api('users.php', { method:'PUT', body: JSON.stringify({ id:id, newPassword: pw }) }).then(function(){ toast('Kata sandi diperbarui.'); }).catch(function(e){ toast(e.message, 'error'); });
  }
});

document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  var msg = document.getElementById('addMsg'); msg.textContent = ''; msg.className = 'msg';
  api('users.php', { method:'POST', body: JSON.stringify({
    username: document.getElementById('newUsername').value.trim(),
    displayName: document.getElementById('newDisplayName').value.trim(),
    password: document.getElementById('newPassword').value,
    isAdmin: document.getElementById('newIsAdmin').checked
  })}).then(function(){
    msg.textContent = 'Pengguna berhasil ditambahkan.'; msg.className = 'msg ok';
    document.getElementById('addForm').reset();
    loadUsers();
  }).catch(function(e){ msg.textContent = e.message; msg.className = 'msg err'; });
});
</script>
</body>
</html>
